<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Тренерский хаб</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #111827;
      color: #f9fafb;
      margin: 0;
      padding: 16px;
      box-sizing: border-box;
    }
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }
    .tab-btn {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background-color: #1f2937;
      color: #9ca3af;
      font-weight: 600;
      cursor: pointer;
    }
    .tab-btn.active {
      background-color: #3b82f6;
      color: #ffffff;
    }
    .content-section {
      display: none;
    }
    .content-section.active {
      display: block;
    }
    .card {
      background-color: #1f2937;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
    }
    .card h3 {
      margin-top: 0;
      color: #60a5fa;
      font-size: 16px;
    }
    .card p {
      margin: 0;
      white-space: pre-wrap;
      color: #e5e7eb;
      line-height: 1.4;
    }
    .field {
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-size: 12px;
      color: #9ca3af;
      margin-bottom: 4px;
    }
    input, textarea {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #374151;
      background-color: #111827;
      color: #ffffff;
      box-sizing: border-box;
      font-size: 14px;
    }
    input[type="file"] {
      padding: 6px;
    }
    .submit-btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background-color: #3b82f6;
      color: #ffffff;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      margin-top: 8px;
    }
    .submit-btn:disabled {
      background-color: #4b5563;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('plan')">Мой план</button>
    <button class="tab-btn" onclick="switchTab('report')">Отправить отчет</button>
  </div>

  <!-- Секция Плана -->
  <div id="plan-section" class="content-section active">
    <div class="card">
      <h3>🏋️ Тренировки</h3>
      <p id="workout-plan">Загрузка...</p>
    </div>
    <div class="card">
      <h3>🥗 Питание (КБЖУ и меню)</h3>
      <p id="nutrition-plan">Загрузка...</p>
    </div>
    <div class="card">
      <h3>📌 Заметка от тренера</h3>
      <p id="trainer-note">Загрузка...</p>
    </div>
  </div>

  <!-- Секция Отчета -->
  <div id="report-section" class="content-section">
    <div class="card">
      <div class="field">
        <label>Вес (кг)</label>
        <input type="text" id="weight" placeholder="например: 75.5">
      </div>
      <div class="field">
        <label>Выполнение плана / Оценка недели</label>
        <input type="text" id="completion" placeholder="например: 100% все тренировки">
      </div>
      <div class="field">
        <label>Видео техники (выбрать из галереи)</label>
        <input type="file" id="videoFile" accept="video/*">
      </div>
      <div class="field">
        <label>Комментарии и самочувствие</label>
        <textarea id="comments" rows="3" placeholder="Болели ли суставы, как сон, сила..."></textarea>
      </div>
      <button class="submit-btn" id="sendBtn" onclick="sendReport()">Отправить отчет</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzLx4E3PQ32BoXgCIPpSfjtt_0Ru88MLTQ8xiKAxWIvQhy43ET0jOhaekUneYVUVkjp/exec';

    function switchTab(tabName) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.content-section').forEach(sec => sec.classList.remove('active'));

      if (tabName === 'plan') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('plan-section').classList.add('active');
      } else {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('report-section').classList.add('active');
      }
    }

    async function loadPlan() {
      const username = tg.initDataUnsafe?.user?.username || "";
      if (!username) {
        document.getElementById('workout-plan').innerText = "Ошибка: не удалось определить Telegram Username.";
        return;
      }

      try {
        const response = await fetch(`${SCRIPT_URL}?username=${username}`);
        const data = await response.json();

        if (data.status === 'success') {
          document.getElementById('workout-plan').innerText = data.data.workout || "Не заполнено";
          document.getElementById('nutrition-plan').innerText = data.data.nutrition || "Не заполнено";
          document.getElementById('trainer-note').innerText = data.data.note || "Не заполнено";
        } else {
          document.getElementById('workout-plan').innerText = "План не найден.";
          document.getElementById('nutrition-plan').innerText = "План не найден.";
          document.getElementById('trainer-note').innerText = "План не найден.";
        }
      } catch (err) {
        document.getElementById('workout-plan').innerText = "Ошибка загрузки плана.";
      }
    }

    async function sendReport() {
      const btn = document.getElementById('sendBtn');
      const fileInput = document.getElementById('videoFile');
      const file = fileInput.files[0];

      btn.disabled = true;
      btn.innerText = "Отправка...";

      let fileData = null;
      let fileName = null;
      let fileType = null;

      if (file) {
        if (file.size > 50 * 1024 * 1024) {
          alert("Видео слишком большое. Выберите файл до 50 МБ.");
          btn.disabled = false;
          btn.innerText = "Отправить отчет";
          return;
        }
        fileData = await readFileAsDataURL(file);
        fileName = file.name;
        fileType = file.type;
      }

      const payload = {
        username: tg.initDataUnsafe?.user?.username || "неизвестно",
        weight: document.getElementById('weight').value,
        completion: document.getElementById('completion').value,
        comments: document.getElementById('comments').value,
        fileData: fileData,
        fileName: fileName,
        fileType: fileType
      };

      try {
        const res = await fetch(SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify(payload)
        });
        const result = await res.json();

        if (result.status === 'success') {
          alert("Отчет успешно отправлен!");
          tg.close();
        } else {
          alert("Ошибка отправки: " + result.message);
          btn.disabled = false;
          btn.innerText = "Отправить отчет";
        }
      } catch (err) {
        alert("Ошибка сети при отправке.");
        btn.disabled = false;
        btn.innerText = "Отправить отчет";
      }
    }

    function readFileAsDataURL(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    loadPlan();
  </script>
</body>
</html>
